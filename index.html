<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Exit of Hell</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(20, 0, 0, 0.7);
            border: 2px solid #8b0000;
            padding: 8px 15px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            font-weight: bold;
            font-size: 16px;
            color: #ff3333;
            text-shadow: 0 0 5px #000;
        }
        #health-bar-container {
            width: 150px;
            height: 16px;
            background: #200;
            border: 1px solid #ff3333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff5555);
            transition: width 0.15s ease-out;
        }

        /* CONTROLE ANALÓGICO MOBILE */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 0, 0, 0.25);
            border-radius: 50%;
            z-index: 15;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.25);
            border: 2px solid rgba(255, 85, 85, 0.5);
            border-radius: 50%;
            position: absolute;
            transition: transform 0.05s ease-out;
            pointer-events: none;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 0, 0, 0.93);
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.8rem;
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #8b0000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(180deg, #8b0000, #4a0000);
            color: #fff;
            border: 2px solid #ff3333;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, background 0.2s;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
            background: #ff0000;
        }
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.5s ease-out;
        }
        .high-score {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #ffaa00;
            text-shadow: 0 0 5px #ffaa00;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-card">
            VIDA
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
        <div class="hud-card">
            NÍVEL: <span id="level-val">1</span>
        </div>
    </div>

    <!-- Joystick Mobile -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen">
        <h1>THE EXIT OF HELL</h1>
        <p>Encontre o pentagrama para escapar de cada nível.<br>Colete poções para curar sua vida.<br>Cuidado com as criaturas nas sombras.</p>
        <button class="btn" id="start-btn">JOGAR</button>
        <div class="high-score">RECORDE: NÍVEL <span id="high-score-start">1</span></div>
    </div>

    <!-- Tela Game Over -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1>VOCÊ MORREU</h1>
        <p id="gameover-reason">Sua alma foi consumida pelo inferno.</p>
        <button class="btn" id="restart-btn">MENU INICIAL</button>
        <div class="high-score">MAIOR NÍVEL ALCANÇADO: <span id="high-score-over">1</span></div>
    </div>

    <div id="flash-overlay"></div>
</div>

<script>
// --- MOTOR DE ÁUDIO SINTETIZADO (WEB AUDIO API) ---
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.lastStepTime = 0;
        this.droneNodes = [];
    }

    init() {
        try {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    this.ctx = new AudioContext();
                }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        } catch(e) {
            console.log("Áudio bloqueado pelo navegador", e);
        }
    }

    stopAmbience() {
        this.droneNodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                if (node.disconnect) node.disconnect();
            } catch (e) {}
        });
        this.droneNodes = [];
    }

    startAmbience(level) {
        if (!this.ctx) return;
        this.stopAmbience();

        try {
            const now = this.ctx.currentTime;
            const baseFreqs = [
                [40, 43, 60],
                [35, 38, 55],
                [45, 48, 63],
                [30, 33, 50],
                [50, 54, 71]
            ];
            const freqs = baseFreqs[(level - 1) % baseFreqs.length];

            freqs.forEach((f, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const lfo = this.ctx.createOscillator();
                const lfoGain = this.ctx.createGain();

                osc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(f, now);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(120 + (level * 10), now);

                lfo.frequency.setValueAtTime(0.1 + (idx * 0.05), now);
                lfoGain.gain.setValueAtTime(0.03, now);
                lfo.connect(lfoGain.gain);

                gain.gain.setValueAtTime(0.08, now);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                lfo.start(now);

                this.droneNodes.push(osc, lfo);
            });
        } catch(e) {}
    }

    playStep() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastStepTime < 0.28) return;
        this.lastStepTime = now;

        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        } catch(e) {}
    }

    playHit() {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.2);
        } catch(e) {}
    }

    playHeal() {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        } catch(e) {}
    }

    playPortal() {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.6);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.6);
        } catch(e) {}
    }

    playGameOver() {
        if (!this.ctx) return;
        this.stopAmbience();
        try {
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 1.2);

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 1.2);
        } catch(e) {}
    }
}

const audio = new SoundEngine();

// --- BANCO DE ASSETS SVG ---
const SVGS = {
    pentagram: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#ff0000" stroke-width="5"/>
        <polygon points="50,10 63,40 95,40 69,60 79,90 50,72 21,90 31,60 5,40 37,40" fill="none" stroke="#ff0000" stroke-width="4"/>
        <circle cx="50" cy="50" r="48" fill="rgba(255,0,0,0.15)"/>
    </svg>`,

    healthPotion: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect x="42" y="10" width="16" height="8" rx="2" fill="#8B4513"/>
        <rect x="38" y="18" width="24" height="12" fill="#bbb" stroke="#333" stroke-width="2"/>
        <path d="M 38 30 C 20 40 15 85 50 88 C 85 85 80 40 62 30 Z" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="3"/>
        <path d="M 22 60 C 20 80 40 85 50 85 C 60 85 80 80 78 60 C 65 65 35 65 22 60 Z" fill="#ff0033"/>
        <circle cx="40" cy="50" r="4" fill="#fff" opacity="0.8"/>
        <circle cx="60" cy="70" r="3" fill="#fff" opacity="0.8"/>
    </svg>`,

    monsters: [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="#8b0000" stroke="#ff0000" stroke-width="3"/>
            <circle cx="65" cy="35" r="8" fill="#fff"/><circle cx="65" cy="35" r="3" fill="#000"/>
            <circle cx="65" cy="65" r="8" fill="#fff"/><circle cx="65" cy="65" r="3" fill="#000"/>
            <path d="M 80 40 Q 90 50 80 60" stroke="#000" stroke-width="4" fill="none"/>
        </svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="32" fill="#111" stroke="#444" stroke-width="3"/>
            <circle cx="70" cy="40" r="5" fill="#ff0000"/>
            <circle cx="70" cy="60" r="5" fill="#ff0000"/>
            <circle cx="65" cy="30" r="3" fill="#ff0000"/>
            <circle cx="65" cy="70" r="3" fill="#ff0000"/>
            <path d="M 40 20 L 10 5 M 50 18 L 30 0 M 40 80 L 10 95 M 50 82 L 30 100" stroke="#222" stroke-width="6" stroke-linecap="round"/>
        </svg>`,
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="35" fill="#4a0000" stroke="#000" stroke-width="4"/>
            <path d="M 30 20 Q 20 -10 40 5 Z" fill="#222"/>
            <path d="M 30 80 Q 20 110 40 95 Z" fill="#222"/>
            <circle cx="65" cy="38" r="7" fill="#ffff00"/>
            <circle cx="65" cy="62" r="7" fill="#ffff00"/>
            <polygon points="75,45 85,50 75,55" fill="#fff"/>
        </svg>`
    ]
};

function svgToImage(svgString) {
    const img = new Image();
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    img.src = URL.createObjectURL(blob);
    return img;
}

const pentagramImg = svgToImage(SVGS.pentagram);
const potionImg = svgToImage(SVGS.healthPotion);
const monsterImgs = SVGS.monsters.map(m => svgToImage(m));

// --- CONFIGURAÇÃO E ESTADO DO JOGO ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let currentLevel = 1;
let highScore = parseInt(localStorage.getItem('toe_highscore')) || 1;

let health = 100;
let player = { 
    x: 0, 
    y: 0, 
    radius: 20, 
    speed: 3.5, 
    angle: 0,
    isMoving: false,
    walkCycle: 0
};

let pentagram = { x: 0, y: 0, radius: 35 };
let monsters = [];
let potions = [];

let mapWidth = 2000;
let mapHeight = 2000;
let tiles = [];
const TILE_SIZE = 100;

let isTouching = false;
let targetPos = { x: 0, y: 0 };

// Estado do Analógico Virtual
let joystickActive = false;
let joystickVector = { x: 0, y: 0 };

const healthBar = document.getElementById('health-bar');
const levelVal = document.getElementById('level-val');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const flashOverlay = document.getElementById('flash-overlay');
const highScoreStart = document.getElementById('high-score-start');
const highScoreOver = document.getElementById('high-score-over');

const joystickContainer = document.getElementById('joystick-container');
const joystickKnob = document.getElementById('joystick-knob');

highScoreStart.textContent = highScore;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- GERAÇÃO DE NÍVEL ---
function initLevel(level) {
    mapWidth = 1500 + level * 200;
    mapHeight = 1500 + level * 200;

    player.x = mapWidth / 2;
    player.y = mapHeight / 2;
    player.angle = 0;
    player.walkCycle = 0;

    tiles = [];
    for (let x = 0; x < mapWidth; x += TILE_SIZE) {
        for (let y = 0; y < mapHeight; y += TILE_SIZE) {
            const shade = Math.floor(Math.random() * 15) + 20; 
            tiles.push({ x, y, color: `rgb(${shade}, ${shade - 5}, ${shade - 5})` });
        }
    }

    let minDistance = 600 + level * 50;
    do {
        pentagram.x = Math.random() * (mapWidth - 200) + 100;
        pentagram.y = Math.random() * (mapHeight - 200) + 100;
    } while (Math.hypot(pentagram.x - player.x, pentagram.y - player.y) < minDistance);

    potions = [];
    const potionCount = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < potionCount; i++) {
        potions.push({
            x: Math.random() * (mapWidth - 200) + 100,
            y: Math.random() * (mapHeight - 200) + 100,
            radius: 18,
            pulse: Math.random() * Math.PI
        });
    }

    monsters = [];
    const monsterCount = 2 + Math.floor(level * 1.5); 
    
    for (let i = 0; i < monsterCount; i++) {
        const imgIndex = Math.floor(Math.random() * monsterImgs.length);
        const baseSize = 20 + Math.random() * 15;
        const sizeMultiplier = 1 + Math.min(level * 0.08, 1.5);
        const radius = baseSize * sizeMultiplier;
        const speed = (1.5 + Math.random() * 1.2) * (1 + Math.min(level * 0.05, 0.8));

        let mx, my;
        do {
            mx = Math.random() * mapWidth;
            my = Math.random() * mapHeight;
        } while (Math.hypot(mx - player.x, my - player.y) < 500);

        monsters.push({
            x: mx,
            y: my,
            radius: radius,
            speed: speed,
            angle: 0,
            img: monsterImgs[imgIndex],
            damageCooldown: 0
        });
    }

    levelVal.textContent = level;
    audio.startAmbience(level);
}

// --- LÓGICA DE ATUALIZAÇÃO ---
function update() {
    if (gameState !== 'PLAYING') return;

    player.isMoving = false;

    // Movimentação via Joystick Analógico
    if (joystickActive) {
        player.isMoving = true;
        player.angle = Math.atan2(joystickVector.y, joystickVector.x);
        player.x += joystickVector.x * player.speed;
        player.y += joystickVector.y * player.speed;

        player.x = Math.max(player.radius, Math.min(mapWidth - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(mapHeight - player.radius, player.y));

        player.walkCycle += 0.25;
        audio.playStep();
    }
    // Movimentação via Toque / Clique Direto
    else if (isTouching) {
        const worldTargetX = targetPos.x + (player.x - canvas.width / 2);
        const worldTargetY = targetPos.y + (player.y - canvas.height / 2);

        const dx = worldTargetX - player.x;
        const dy = worldTargetY - player.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 5) {
            player.isMoving = true;
            player.angle = Math.atan2(dy, dx);
            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;

            player.x = Math.max(player.radius, Math.min(mapWidth - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(mapHeight - player.radius, player.y));

            player.walkCycle += 0.25;
            audio.playStep();
        }
    }

    if (!player.isMoving) {
        player.walkCycle += (0 - player.walkCycle) * 0.2;
    }

    // Colisão com Poções de Vida
    for (let i = potions.length - 1; i >= 0; i--) {
        const p = potions[i];
        p.pulse += 0.05;
        const distPotion = Math.hypot(p.x - player.x, p.y - player.y);

        if (distPotion < player.radius + p.radius) {
            healPlayer(20);
            audio.playHeal();
            potions.splice(i, 1);
        }
    }

    // Colisão com Pentagrama
    const distPentagram = Math.hypot(pentagram.x - player.x, pentagram.y - player.y);
    if (distPentagram < player.radius + pentagram.radius) {
        audio.playPortal();
        nextLevel();
        return;
    }

    // Atualizar Monstros
    monsters.forEach(m => {
        if (m.damageCooldown > 0) m.damageCooldown--;

        const mdx = player.x - m.x;
        const mdy = player.y - m.y;
        const mdist = Math.hypot(mdx, mdy);

        m.angle = Math.atan2(mdy, mdx);
        
        if (mdist > 10) {
            m.x += Math.cos(m.angle) * m.speed;
            m.y += Math.sin(m.angle) * m.speed;
        }

        if (mdist < player.radius + m.radius && m.damageCooldown === 0) {
            takeDamage(5);
            m.damageCooldown = 30;
        }
    });
}

function healPlayer(amount) {
    health = Math.min(100, health + amount);
    healthBar.style.width = health + '%';
}

function takeDamage(amount) {
    health = Math.max(0, health - amount);
    healthBar.style.width = health + '%';
    audio.playHit();

    if (health <= 0) {
        audio.playGameOver();
        gameOver();
    }
}

function nextLevel() {
    gameState = 'TRANSITION';
    flashOverlay.style.opacity = '1';

    setTimeout(() => {
        currentLevel++;
        if (currentLevel > highScore) {
            highScore = currentLevel;
            localStorage.setItem('toe_highscore', highScore);
        }
        initLevel(currentLevel);
        gameState = 'PLAYING';
        flashOverlay.style.opacity = '0';
    }, 500);
}

function gameOver() {
    gameState = 'GAMEOVER';
    highScoreOver.textContent = highScore;
    gameoverScreen.style.display = 'flex';
}

// --- RENDERIZAÇÃO DO PERSONAGEM COM ANIMAÇÃO ---
function drawAnimatedPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    const swingArm = Math.sin(player.walkCycle) * 10; 
    const bodyBob = Math.abs(Math.cos(player.walkCycle)) * 2;

    ctx.fillStyle = "#3a3a3a";
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(0, 0, 18 + bodyBob * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#555";
    ctx.beginPath();
    ctx.arc(-2 + swingArm, -20, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-2 - swingArm, 20, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#e0ac69";
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.fillRect(4, -4, 3, 3);
    ctx.fillRect(4, 1, 3, 3);

    ctx.restore();
}

// --- RENDERIZAÇÃO ---
function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') return;

    ctx.save();
    ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

    tiles.forEach(t => {
        if (t.x + TILE_SIZE > player.x - canvas.width && t.x < player.x + canvas.width &&
            t.y + TILE_SIZE > player.y - canvas.height && t.y < player.y + canvas.height) {
            ctx.fillStyle = t.color;
            ctx.fillRect(t.x, t.y, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#111';
            ctx.strokeRect(t.x, t.y, TILE_SIZE, TILE_SIZE);
        }
    });

    ctx.drawImage(
        pentagramImg, 
        pentagram.x - pentagram.radius, 
        pentagram.y - pentagram.radius, 
        pentagram.radius * 2, 
        pentagram.radius * 2
    );

    potions.forEach(p => {
        ctx.save();
        const floatOffset = Math.sin(p.pulse) * 4;
        ctx.drawImage(
            potionImg, 
            p.x - p.radius, 
            p.y - p.radius + floatOffset, 
            p.radius * 2, 
            p.radius * 2
        );
        ctx.restore();
    });

    monsters.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.angle);
        ctx.drawImage(m.img, -m.radius, -m.radius, m.radius * 2, m.radius * 2);
        ctx.restore();
    });

    drawAnimatedPlayer();

    ctx.restore();

    drawCircularLight();
}

function drawCircularLight() {
    ctx.save();

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    const innerLightRadius = 60;
    const outerLightRadius = 130; 

    const lightGradient = ctx.createRadialGradient(
        centerX, centerY, innerLightRadius,
        centerX, centerY, outerLightRadius
    );

    lightGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
    lightGradient.addColorStop(1, 'rgba(0, 0, 0, 0.98)');

    ctx.fillStyle = lightGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.restore();
}

// --- LOOP DO JOGO ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// --- INPUTS AJUSTADOS COM SUPORTE AO JOYSTICK ---
function handleInputStart(e) {
    if (e.target.tagName === 'BUTTON' || e.target.closest('.screen') || e.target.closest('#joystick-container')) return;

    audio.init();
    if (gameState !== 'PLAYING') return;
    isTouching = true;
    updateInputPos(e);
}

function handleInputMove(e) {
    if (!isTouching || gameState !== 'PLAYING') return;
    updateInputPos(e);
}

function handleInputEnd() {
    isTouching = false;
}

function updateInputPos(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    targetPos.x = clientX;
    targetPos.y = clientY;
}

// Eventos do Joystick Virtual
function handleJoystickStart(e) {
    e.stopPropagation();
    audio.init();
    if (gameState !== 'PLAYING') return;
    joystickActive = true;
    handleJoystickMove(e);
}

function handleJoystickMove(e) {
    if (!joystickActive || gameState !== 'PLAYING') return;

    const rect = joystickContainer.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const touch = e.touches ? e.touches[0] : e;
    const dx = touch.clientX - centerX;
    const dy = touch.clientY - centerY;
    const distance = Math.hypot(dx, dy);
    const maxRadius = rect.width / 2;

    const angle = Math.atan2(dy, dx);
    const clampedDistance = Math.min(distance, maxRadius);

    const knobX = Math.cos(angle) * clampedDistance;
    const knobY = Math.sin(angle) * clampedDistance;

    joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

    joystickVector.x = knobX / maxRadius;
    joystickVector.y = knobY / maxRadius;
}

function handleJoystickEnd() {
    joystickActive = false;
    joystickVector = { x: 0, y: 0 };
    joystickKnob.style.transform = 'translate(0px, 0px)';
}

// Eventos de EventListener do Joystick
joystickContainer.addEventListener('touchstart', handleJoystickStart, { passive: true });
window.addEventListener('touchmove', (e) => {
    if (joystickActive) {
        handleJoystickMove(e);
        e.preventDefault();
    } else if (gameState === 'PLAYING') {
        handleInputMove(e);
        e.preventDefault();
    }
}, { passive: false });
window.addEventListener('touchend', () => {
    handleJoystickEnd();
    handleInputEnd();
});

// Eventos de Mouse
window.addEventListener('mousedown', handleInputStart);
window.addEventListener('mousemove', handleInputMove);
window.addEventListener('mouseup', handleInputEnd);

// Eventos de Toque Padrão
window.addEventListener('touchstart', (e) => {
    if (e.target.tagName !== 'BUTTON' && !e.target.closest('#joystick-container')) {
        handleInputStart(e);
    }
}, { passive: true });

// --- LÓGICA DE INÍCIO DO JOGO ---
function startGame() {
    audio.init();
    startScreen.style.display = 'none';
    currentLevel = 1;
    health = 100;
    healthBar.style.width = '100%';
    initLevel(currentLevel);
    gameState = 'PLAYING';
}

function restartGame() {
    audio.init();
    gameoverScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    highScoreStart.textContent = highScore;
    gameState = 'MENU';
}

// Ações de clique e toque nos botões
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startGame();
});

restartBtn.addEventListener('click', restartGame);
restartBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    restartGame();
});

gameLoop();
</script>
